<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            padding: 30px;
        }

        .register-box {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #173b7a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 17px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #173b7a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0f2a59;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #173b7a;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #173b7a;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h2>Student Registration</h2>

        <p class="subtitle">Create your placement account</p>

        <form onsubmit="registerStudent(event)">

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Branch</label>
            <select id="branch" required>
                <option value="">Select Branch</option>
                <option value="CSE">Computer Science Engineering</option>
                <option value="ECE">Electronics and Communication Engineering</option>
                <option value="EEE">Electrical and Electronics Engineering</option>
                <option value="MECH">Mechanical Engineering</option>
                <option value="CIVIL">Civil Engineering</option>
            </select>

            <label>CGPA</label>
            <input type="number" id="cgpa" placeholder="Enter your CGPA"
                   min="0" max="10" step="0.01" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Create a password" required>

            <button type="submit">Register</button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="student-login.html">Login</a>
        </div>

        <a class="back" href="index.html">← Back to Home</a>

    </div>

    <script>
        function registerStudent(event) {
            event.preventDefault();

            alert("Student Registration submitted successfully!");
        }
    </script>

</body>
</html>
