<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .box {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #173b7a;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #173b7a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #173b7a;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Student Login</h2>

        <input type="email" placeholder="Enter Email">

        <input type="password" placeholder="Enter Password">

        <button onclick="goToDashboard()">Login</button>

        <div class="links">

            <p>Don't have an account?</p>

            <a href="student-register.html">Register Here</a>

            <br><br>

            <a href="index.html">← Back to Home</a>

        </div>

    </div>

    <script>
        function goToDashboard() {
            window.location.href = "student-dashboard.html";
        }
    </script>

</body>
</html>
