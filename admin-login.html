<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            padding: 20px;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #173b7a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #173b7a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0f2a59;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #173b7a;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Admin Login</h2>

    <p class="subtitle">Login to manage the placement system</p>

    <form onsubmit="adminLogin(event)">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter admin password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <a class="back" href="index.html">
        ← Back to Home
    </a>

</div>

<script>
function adminLogin(event) {

    event.preventDefault();

    alert("Admin Login submitted successfully!");

}
</script>

</body>
</html>
