<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Campus Placement System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        header {
            background: #173b7a;
            color: white;
            padding: 20px 50px;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .login-box {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .login-box h2 {
            text-align: center;
            color: #173b7a;
            margin-bottom: 25px;
        }

        .login-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #173b7a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #173b7a;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Campus Placement System</h1>
</header>

<div class="login-container">

    <div class="login-box">

        <h2>Admin Login</h2>

        <form action="admin-dashboard.html">

            <label>Email</label>
            <input type="email" placeholder="Enter admin email" required>

            <label>Password</label>
            <input type="password" placeholder="Enter password" required>

            <button type="submit">Login</button>

        </form>

        <a href="index.html" class="back">← Back to Home</a>

    </div>

</div>

</body>
</html>
