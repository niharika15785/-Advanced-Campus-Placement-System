<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #173b7a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #173b7a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .register, .back {
            display: block;
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #173b7a;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Company Login</h2>

    <p class="subtitle">Login to your company account</p>

    <form onsubmit="companyLogin(event)">

        <label>Email</label>
        <input type="email" placeholder="Enter company email" required>

        <label>Password</label>
        <input type="password" placeholder="Enter password" required>

        <button type="submit">Login</button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="company-register.html">Register here</a>
    </div>

    <a class="back" href="index.html">← Back to Home</a>

</div>

<script>
function companyLogin(event) {
    event.preventDefault();
    alert("Company Login submitted successfully!");
}
</script>

</body>
</html>
