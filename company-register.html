<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            padding: 30px;
        }

        .register-box {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #173b7a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 17px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #173b7a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0f2a59;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a,
        .back {
            color: #173b7a;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-weight: normal;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h2>Company Registration</h2>

    <p class="subtitle">Create your company account</p>

    <form onsubmit="registerCompany(event)">

        <label>Company Name</label>
        <input
            type="text"
            id="companyName"
            placeholder="Enter company name"
            required
        >

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter company email"
            required
        >

        <label>Phone</label>
        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
            required
        >

        <label>Location</label>
        <input
            type="text"
            id="location"
            placeholder="Enter company location"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">Register Company</button>

    </form>

    <div class="login-link">
        Already registered?
        <a href="company-login.html">Login here</a>
    </div>

    <a class="back" href="index.html">← Back to Home</a>

</div>

<script>
function registerCompany(event) {
    event.preventDefault();

    alert("Company Registration submitted successfully!");
}
</script>

</body>
</html>
