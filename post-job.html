<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Post Job - Advanced Campus Placement System
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f7fb;
            color: #333;
        }


        header {
            background: #173b7a;
            color: white;
            padding: 20px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        header h1 {
            font-size: 25px;
        }


        header a {
            background: white;
            color: #173b7a;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 6px;

            font-weight: bold;
        }


        .container {
            width: 90%;
            max-width: 800px;

            margin: 40px auto;
        }


        .form-box {
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.10);
        }


        .form-box h2 {
            text-align: center;

            color: #173b7a;

            margin-bottom: 10px;
        }


        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            color: #333;
        }


        input,
        textarea,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

            outline: none;
        }


        input:focus,
        textarea:focus,
        select:focus {

            border-color: #173b7a;
        }


        textarea {

            min-height: 120px;

            resize: vertical;
        }


        .row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }


        .submit-btn {

            width: 100%;

            padding: 13px;

            background: #173b7a;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }


        .submit-btn:hover {

            background: #0f2a59;
        }


        .success-message {

            display: none;

            background: #d4edda;

            color: #155724;

            padding: 15px;

            border-radius: 6px;

            margin-bottom: 20px;

            text-align: center;

            font-weight: bold;
        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #173b7a;

            text-decoration: none;

            font-weight: bold;
        }


        footer {

            background: #173b7a;

            color: white;

            text-align: center;

            padding: 18px;

            margin-top: 50px;
        }


        @media (max-width: 700px) {

            header {

                padding: 20px;
            }


            .container {

                width: 94%;
            }


            .row {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <h1>
        Company Portal
    </h1>


    <a href="company-dashboard.html">
        Dashboard
    </a>

</header>



<!-- MAIN -->

<div class="container">


    <div class="form-box">


        <h2>
            Post a New Job
        </h2>


        <p class="subtitle">
            Enter the details of the job opportunity
        </p>



        <!-- SUCCESS MESSAGE -->

        <div
            class="success-message"
            id="successMessage">

            Job posted successfully!

        </div>



        <!-- FORM -->

        <form
            id="jobForm"
            onsubmit="postJob(event)">


            <!-- JOB TITLE -->

            <div class="form-group">

                <label for="jobTitle">
                    Job Title
                </label>

                <input
                    type="text"
                    id="jobTitle"
                    placeholder="Example: Software Developer"
                    required>

            </div>



            <!-- JOB DESCRIPTION -->

            <div class="form-group">

                <label for="jobDescription">
                    Job Description
                </label>

                <textarea
                    id="jobDescription"
                    placeholder="Enter job description and responsibilities"
                    required></textarea>

            </div>



            <!-- SKILLS -->

            <div class="form-group">

                <label for="requiredSkills">
                    Required Skills
                </label>

                <input
                    type="text"
                    id="requiredSkills"
                    placeholder="Example: Java, SQL, HTML, CSS"
                    required>

            </div>



            <!-- SALARY + CGPA -->

            <div class="row">


                <div class="form-group">

                    <label for="salary">
                        Package / Salary
                    </label>

                    <input
                        type="text"
                        id="salary"
                        placeholder="Example: 5 LPA"
                        required>

                </div>



                <div class="form-group">

                    <label for="minimumCgpa">
                        Minimum CGPA Required
                    </label>

                    <input
                        type="number"
                        id="minimumCgpa"
                        min="0"
                        max="10"
                        step="0.01"
                        placeholder="Example: 7.0"
                        required>

                </div>

            </div>



            <!-- LOCATION -->

            <div class="form-group">

                <label for="jobLocation">
                    Job Location
                </label>

                <input
                    type="text"
                    id="jobLocation"
                    placeholder="Example: Hyderabad"
                    required>

            </div>



            <!-- JOB TYPE -->

            <div class="form-group">

                <label for="jobType">
                    Job Type
                </label>

                <select
                    id="jobType"
                    required>

                    <option value="">
                        Select Job Type
                    </option>

                    <option value="Full Time">
                        Full Time
                    </option>

                    <option value="Internship">
                        Internship
                    </option>

                    <option value="Full Time + Internship">
                        Full Time + Internship
                    </option>

                </select>

            </div>



            <!-- ELIGIBILITY BRANCH -->

            <div class="form-group">

                <label for="eligibleBranch">
                    Eligible Branch
                </label>

                <select
                    id="eligibleBranch"
                    required>

                    <option value="">
                        Select Branch
                    </option>

                    <option value="CSE">
                        CSE
                    </option>

                    <option value="ECE">
                        ECE
                    </option>

                    <option value="EEE">
                        EEE
                    </option>

                    <option value="MECH">
                        Mechanical
                    </option>

                    <option value="CIVIL">
                        Civil
                    </option>

                    <option value="All Branches">
                        All Branches
                    </option>

                </select>

            </div>



            <!-- LAST DATE -->

            <div class="form-group">

                <label for="lastDate">
                    Last Date to Apply
                </label>

                <input
                    type="date"
                    id="lastDate"
                    required>

            </div>



            <!-- BUTTON -->

            <button
                type="submit"
                class="submit-btn">

                Post Job

            </button>


        </form>



        <a
            href="company-dashboard.html"
            class="back-link">

            ← Back to Company Dashboard

        </a>


    </div>

</div>



<!-- FOOTER -->

<footer>

    © 2026 Advanced Campus Placement System

</footer>



<script>


/* ==========================================
   POST JOB FUNCTION
========================================== */

function postJob(event) {

    event.preventDefault();


    /* GET FORM VALUES */

    const title =
        document.getElementById(
            "jobTitle"
        ).value.trim();


    const description =
        document.getElementById(
            "jobDescription"
        ).value.trim();


    const skills =
        document.getElementById(
            "requiredSkills"
        ).value.trim();


    const salary =
        document.getElementById(
            "salary"
        ).value.trim();


    const cgpa =
        document.getElementById(
            "minimumCgpa"
        ).value;


    const location =
        document.getElementById(
            "jobLocation"
        ).value.trim();


    const jobType =
        document.getElementById(
            "jobType"
        ).value;


    const branch =
        document.getElementById(
            "eligibleBranch"
        ).value;


    const lastDate =
        document.getElementById(
            "lastDate"
        ).value;



    /* VALIDATION */

    if (
        title === "" ||
        description === "" ||
        skills === "" ||
        salary === "" ||
        cgpa === "" ||
        location === "" ||
        jobType === "" ||
        branch === "" ||
        lastDate === ""
    ) {

        alert(
            "Please fill all the fields."
        );

        return;

    }



    /* LOAD OLD JOBS */

    let postedJobs =
        JSON.parse(
            localStorage.getItem(
                "postedJobs"
            )
        ) || [];



    /* CREATE NEW JOB */

    const newJob = {

        id:
            Date.now(),

        title:
            title,

        description:
            description,

        skills:
            skills,

        salary:
            salary,

        cgpa:
            cgpa,

        location:
            location,

        jobType:
            jobType,

        branch:
            branch,

        lastDate:
            lastDate,

        postedDate:
            new Date().toLocaleDateString(),

        status:
            "Active"

    };



    /* ADD JOB */

    postedJobs.push(
        newJob
    );



    /* SAVE JOB */

    localStorage.setItem(

        "postedJobs",

        JSON.stringify(
            postedJobs
        )

    );



    /* SHOW SUCCESS */

    document.getElementById(
        "successMessage"
    ).style.display = "block";



    /* RESET FORM */

    document.getElementById(
        "jobForm"
    ).reset();



    /* GO TO DASHBOARD */

    setTimeout(
        function() {

            window.location.href =
                "company-dashboard.html";

        },
        1500
    );

}

</script>


</body>

</html>
