<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Job - Campus Placement System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        header {
            background: #173b7a;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            background: white;
            color: #173b7a;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
        }

        .container {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .form-box {
            background: white;
            width: 550px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #173b7a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #173b7a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        footer {
            background: #173b7a;
            color: white;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>

<body>

<header>
    <h1>Company Portal</h1>
    <a href="company-dashboard.html">Dashboard</a>
</header>

<div class="container">

    <div class="form-box">

        <h2>Post a New Job</h2>

        <form action="company-dashboard.html">

            <label>Job Title</label>
            <input type="text" placeholder="Enter job title" required>

            <label>Job Description</label>
            <textarea placeholder="Enter job description" required></textarea>

            <label>Required Skills</label>
            <input type="text" placeholder="Example: Java, SQL, HTML, CSS" required>

            <label>Package / Salary</label>
            <input type="text" placeholder="Example: 5 LPA" required>

            <label>Minimum CGPA Required</label>
            <input type="number" step="0.01" min="0" max="10"
                   placeholder="Example: 7.0" required>

            <label>Job Location</label>
            <input type="text" placeholder="Enter job location" required>

            <button type="submit">Post Job</button>

        </form>

    </div>

</div>

<footer>
    © 2026 Advanced Campus Placement System
</footer>

</body>
</html>
